<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natale 2025</title>

<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#555;
  --accent:#007aff; --active:#dff0ff; --btnText:#fff;
  --shadow: 0 8px 20px rgba(0,0,0,.08);
}
body.dark{
  --bg:#0f1115; --card:#171a21; --text:#f1f3f5; --muted:#b7bcc6;
  --accent:#4aa3ff; --active:#223045; --btnText:#071018;
  --shadow: 0 10px 24px rgba(0,0,0,.35);
}
body{
  margin:0;
  font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  max-width:860px;
  margin:0 auto;
  padding:16px 16px 28px;
}
h1{
  text-align:center;
  font-size:1.8rem;
  margin:14px 0 10px;
}

button{
  padding:16px;
  font-size:1.1rem;
  font-weight:700;
  border-radius:14px;
  border:none;
  background:var(--accent);
  color:var(--btnText);
  box-shadow:var(--shadow);
}
button:active{ transform:scale(0.98); }

.hidden{ display:none; }

/* Login */
#login{
  margin-top:40px;
  text-align:center;
}
#login input{
  padding:14px;
  font-size:1.1rem;
  width:100%;
  max-width:280px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-bottom:12px;
}

/* Player UI */
.controls{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:10px 0 14px;
}
.controls button{
  flex:1;                 /* bottone largo uguale */
  min-width: 0;           /* evita overflow su mobile */
}

.track{
  padding:14px 16px;
  background:var(--card);
  margin-bottom:10px;
  border-radius:14px;
  font-size:1.05rem;
  box-shadow:var(--shadow);
  cursor:pointer;
}
.track:active{ filter:brightness(0.96); }

.active{ background:var(--active); font-weight:800; }

.notice{
  text-align:center;
  color:var(--muted);
  margin:6px 0 16px;
  font-size:0.98rem;
}

audio{ width:100%; margin:8px 0 10px; }

@media (max-width:520px){
  h1{ font-size:1.65rem; }
  button{ font-size:1.05rem; padding:18px; }
  .track{ padding:16px; }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h1>🔒 Natale 2025</h1>
  <p>Inserisci la password</p>
  <input id="pwd" type="password" placeholder="Password" autocomplete="off">
  <br>
  <button id="enterBtn" onclick="checkPwd()">Entra</button>
  <p id="err" class="notice"></p>
</div>

<!-- CONTENUTO -->
<div id="content" class="hidden">

  <h1>🎄 Natale 2025</h1>

  <p style="text-align:center; margin: 0 0 10px;">
    <a href="https://albertoacquadro.github.io/music/">← Torna a Music</a>
  </p>

  <div class="controls">
    <button id="playBtn">▶ Play</button>
    <button id="nextBtn">⏭ Next</button>
    <button id="shuffleBtn">🔀 Shuffle</button>
  </div>

  <audio id="player" controls preload="metadata"></audio>
  <div id="msg" class="notice">Tocca Play o scegli un brano.</div>

  <div id="playlist"></div>

</div>

<script>
/* -------- PASSWORD -------- */
const PASSWORD = "2026";

const pwdInput = document.getElementById("pwd");
pwdInput.focus();

// Enter per entrare
pwdInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") checkPwd();
});

function checkPwd(){
  const v = pwdInput.value;
  if(v === PASSWORD){
    document.getElementById("login").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");
  } else {
    document.getElementById("err").textContent = "Password errata";
  }
}

/* -------- PLAYER -------- */
const originalTracks = [
  "mp3/Cesare Cremonini - Ora che non ho più te.mp3",
  "mp3/Cesare Cremonini - Ragazze facili.mp3",
  "mp3/Cesare Cremonini, Luca Carboni - San Luca.mp3",
  "mp3/Ernia - PER TE.mp3",
  "mp3/Geolier - FOTOGRAFIA (Visual Video).mp3",
  "mp3/Giorgia - GOLPE (Official Video).mp3",
  "mp3/Jovanotti - Fuorionda.mp3",
  "mp3/Levante - DELL'AMORE IL FALLIMENTO (Official Video).mp3",
  "mp3/Olly, Angelina Mango, Juli - Per due come noi (Official Video).mp3",
  "mp3/Olly, Juli - Questa domenica (Official Video).mp3",
  "mp3/So solo che la vita (BROOKLYN STUDIO, JOVA SESSION 25).mp3",
  "mp3/Tommaso Paradiso - Lasciamene un po' (Official Video).mp3",
  "mp3/eroCaddeo - punto (Visual Video).mp3"
];

let tracks = [...originalTracks];
let index = 0;

const player = document.getElementById("player");
const list = document.getElementById("playlist");
const msg = document.getElementById("msg");

document.getElementById("playBtn").onclick = () => play(index);
document.getElementById("nextBtn").onclick = () => next();
document.getElementById("shuffleBtn").onclick = () => shuffleManual();

function render(){
  list.innerHTML = "";
  tracks.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "track" + (i===index ? " active" : "");
    d.textContent = t.replace("mp3/","");
    d.onclick = () => play(i);
    list.appendChild(d);
  });
}

function play(i){
  index = i;
  player.src = encodeURI(tracks[index]);
  msg.textContent = tracks[index].replace("mp3/","");
  player.play().catch(() => {
    msg.textContent = "Premi ▶︎ nel player per avviare (blocco autoplay del browser).";
  });
  render();
}

function next(){
  index = (index + 1) % tracks.length;
  play(index);
}

function shuffleManual(){
  tracks = [...tracks].sort(()=>Math.random()-0.5);
  index = 0;
  render();
  msg.textContent = "Shuffle fatto. Premi Play.";
}

player.onended = next;
render();
</script>

</body>
</html>
