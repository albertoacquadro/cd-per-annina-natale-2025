<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CD 2024 – Annina</title>
<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#555; --accent:#007aff;
  --shadow: 0 10px 22px rgba(0,0,0,.10);
}
body{
  margin:0; font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  max-width: 860px; margin: 0 auto; padding: 18px 16px 28px;
}
h1{ text-align:center; margin: 14px 0 10px; font-size: 1.8rem; }
.notice{
  background: var(--card);
  padding: 16px;
  border-radius: 16px;
  box-shadow: var(--shadow);
  color: var(--muted);
  line-height: 1.35;
}
a.btn{
  display:inline-block;
  margin-top: 14px;
  background: var(--accent);
  color: white;
  text-decoration:none;
  padding: 14px 16px;
  border-radius: 14px;
  font-weight: 800;
}
a.btn:active{ transform: scale(0.99); }
</style>
</head>
<body>

<h1>📀 CD 2024</h1>

<div class="notice">
  Qui metteremo la playlist del 2024.<br>
  Per ora la pagina è pronta: quando carichi gli mp3 (in <code>2024/mp3/</code>) aggiungiamo il player come nel 2025.
  <br><br>
  <a class="btn" href="../">⬅ Home</a>
</div>

</body>
</html>
