<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>CD per Annina – Natale 2025</title>
<style>
body {
  font-family: sans-serif;
  background: #f5f5f5;
  max-width: 700px;
  margin: 30px auto;
}
h1 { text-align: center; }
button {
  padding: 10px 15px;
  margin: 5px;
  font-size: 14px;
}
.track {
  padding: 8px;
  background: white;
  margin-bottom: 5px;
  border-radius: 6px;
}
.active {
  background: #dff0ff;
}
</style>
</head>
<body>

<h1>🎄 CD per Annina – Natale 2025</h1>

<div>
  <button onclick="playAll()">▶ Play</button>
  <button onclick="next()">⏭ Next</button>
  <button onclick="shuffle()">🔀 Shuffle</button>
</div>

<audio id="player" controls style="width:100%; margin-top:10px;"></audio>

<div id="playlist"></div>

<script>
const tracks = [
  "mp3/Cesare Cremonini - Ora che non ho più te.mp3",
  "mp3/Cesare Cremonini - Ragazze facili.mp3",
  "mp3/Cesare Cremonini, Luca Carboni - San Luca.mp3",
  "mp3/Ernia - PER TE.mp3",
  "mp3/Geolier - FOTOGRAFIA (Visual Video).mp3",
  "mp3/Giorgia - GOLPE (Official Video).mp3",
  "mp3/Jovanotti - Fuorionda.mp3",
  "mp3/Levante - DELL'AMORE IL FALLIMENTO (Official Video).mp3",
  "mp3/Olly, Angelina Mango, Juli - Per due come noi (Official Video).mp3",
  "mp3/Olly, Juli - Questa domenica (Official Video).mp3",
  "mp3/So solo che la vita (BROOKLYN STUDIO, JOVA SESSION 25).mp3",
  "mp3/Tommaso Paradiso - Lasciamene un po' (Official Video).mp3",
  "mp3/eroCaddeo - punto (Visual Video).mp3"
];

let index = 0;
const player = document.getElementById("player");
const list = document.getElementById("playlist");

function render() {
  list.innerHTML = "";
  tracks.forEach((t,i)=>{
    const d=document.createElement("div");
    d.className="track"+(i===index?" active":"");
    d.textContent=t.replace("mp3/","");
    d.onclick=()=>play(i);
    list.appendChild(d);
  });
}

function play(i){
  index=i;
  player.src=tracks[index];
  player.play();
  render();
}

function playAll(){ play(index); }
function next(){ index=(index+1)%tracks.length; play(index); }

function shuffle(){
  tracks.sort(()=>Math.random()-0.5);
  index=0;
  play(index);
}

player.onended = next;
render();
</script>

</body>
</html>
