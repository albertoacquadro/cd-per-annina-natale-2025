<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raccolta CD – Annina</title>
<style>
:root{
  --bg:#f5f5f5; --card:#fff; --text:#111; --muted:#555; --accent:#007aff;
  --shadow: 0 10px 22px rgba(0,0,0,.10);
}
body{
  margin:0; font-family: system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--text);
  max-width: 860px; margin: 0 auto; padding: 18px 16px 28px;
}
h1{ text-align:center; margin: 14px 0 8px; font-size: 1.9rem; }
p{ text-align:center; margin: 0 0 18px; color: var(--muted); }

.grid{
  display:grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
a.card{
  display:block;
  background: var(--card);
  padding: 16px 16px;
  border-radius: 16px;
  text-decoration:none;
  color: inherit;
  box-shadow: var(--shadow);
}
a.card:active{ transform: scale(0.99); }
.title{ font-weight: 800; font-size: 1.2rem; margin-bottom: 6px; }
.sub{ color: var(--muted); font-size: 1rem; }

@media (min-width: 640px){
  .grid{ grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<h1>🎁 Raccolta CD per Annina</h1>
<p>Scegli un anno (o un CD) e premi play.</p>

<div class="grid">
  <a class="card" href="./2025/">
    <div class="title">🎄 CD per Annina – Natale 2025</div>
    <div class="sub">Playlist 2025 (quella attuale)</div>
  </a>

  <a class="card" href="./2024/">
    <div class="title">📀 CD 2024</div>
    <div class="sub">Pagina pronta (musica da caricare)</div>
  </a>
</div>

</body>
</html>
